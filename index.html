  <script>
    // Intercept and safely suppress unhandled third-party script and iframe permission/sandbox errors
    window.addEventListener('error', function (e) {
      if (!e) return;
      var msg = e.message || '';
      var filename = e.filename || '';
      if (
        msg.indexOf('Script error') !== -1 ||
        msg.indexOf('not granted') !== -1 ||
        msg.indexOf('permission') !== -1 ||
        filename.indexOf('effectivecpmnetwork') !== -1 ||
        filename.indexOf('highperformanceformat') !== -1
      ) {
        e.preventDefault();
        e.stopPropagation();
        return true;
      }
    }, true);

    window.addEventListener('unhandledrejection', function (e) {
      if (!e) return;
      var reason = e.reason;
      var msg = reason instanceof Error ? reason.message : String(reason);
      if (
        msg.indexOf('not granted') !== -1 ||
        msg.indexOf('fullscreen') !== -1 ||
        msg.indexOf('orientation') !== -1 ||
        msg.indexOf('permission') !== -1 ||
        msg.indexOf('Script error') !== -1
      ) {
        e.preventDefault();
        e.stopPropagation();
      }
    });
  </script>
